; Looking Glass client settings for win10-gpu. Installed to ~/.config/looking-glass/client.ini.
[app]
shmFile=/dev/shm/looking-glass

[spice]
; SPICE gives keyboard, mouse and audio; video comes over the shared memory.
host=127.0.0.1
port=5904
scaleCursor=yes
alwaysShowCursor=yes

[win]
title=Windows (GTX 1650)
size=1600x900
keepAspect=yes

[input]
; The laptop has no Scroll Lock key. Right Ctrl: capture/release keyboard+mouse.
; Hold Right Ctrl + F: full screen. Right Ctrl + Q: quit the client (Windows keeps running).
escapeKey=KEY_RIGHTCTRL
rawMouse=yes
mouseSmoothing=no
helpMenuDelay=400
