# Drop-in for the upstream linuwu_sense.service: the module's sysfs files appear only after the module
# loads, after systemd-tmpfiles-setup already ran at boot. Apply the group permissions again here.
[Unit]
After=systemd-modules-load.service

[Service]
ExecStart=/usr/bin/systemd-tmpfiles --create /etc/tmpfiles.d/linuwu_sense.conf
