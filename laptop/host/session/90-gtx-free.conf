# /etc/environment.d/90-gtx-free.conf - for every desktop session (systemd user manager).
# Apps draw on the Intel iGPU only, so no session process (GTK4 apps, xdg-desktop-portal-gnome, ...)
# holds the GTX 1650 open, and `gpu-mode win` can move it to Windows at any time.
# Run a Linux app on the GTX anyway with: gtx-run <app>
__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
VK_DRIVER_FILES=/usr/share/vulkan/icd.d/intel_icd.json
