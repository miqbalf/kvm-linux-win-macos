# Drop-in for gnome-remote-desktop-headless.service: start after the headless shell, stop with the target,
# software rendering (do not open the GTX 1650).
[Unit]
After=linux-headless-shell.service
PartOf=linux-headless-rdp.target

[Service]
Environment=LIBGL_ALWAYS_SOFTWARE=1 __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
